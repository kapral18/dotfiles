# Eval fixture matrix for the SOP policy compiler (data only, no execution).
# One scenario triple (positive/negative/malformed) per compiled rule id.
harnesses:
  - "claude"
  - "codex"
  - "cursor"
  - "opencode"
  - "gemini"
  - "copilot"
  - "pi"
  - "generic"
frontier_models:
  - "claude-sonnet-5"
  - "claude-opus-4.8"
  - "gpt-5.5"
  - "gpt-5.6-terra"
agent_roles:
  - "main-session"
  - "subagent-static-pinned"
repetitions:
  - 1
