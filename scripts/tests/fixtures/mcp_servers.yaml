mcp_servers:
  - name: public-tool
    command: docker
    args:
      - run
      - "--rm"
      - "-i"
      - public/image
    codex_default_tools_approval_mode: approve
    codex_tool_approval_modes:
      read: approve
      write: prompt

  - name: http-tool
    type: http
    url: https://mcp.example.com/mcp
    oauth_by_tool:
      claude:
        clientId: "$(echo resolved-client-id)"
        callbackPort: 3118

  - name: plain-tool
    command: echo
    args:
      - plain
