mcp_servers:
  - name: public-tool
    work_only: false
    command: docker
    args:
      - run
      - "--rm"
      - "-i"
      - public/image
    codex_default_tools_approval_mode: approve
    codex_tool_approval_modes:
      read: approve
      write: prompt

  - name: work-tool
    work_only: true
    command: bash
    args:
      - "-lc"
      - 'echo "hello from work"'

  - name: http-tool
    work_only: false
    type: http
    url: https://mcp.example.com/mcp
    oauth_by_tool:
      claude:
        clientId: "$(echo resolved-client-id)"
        callbackPort: 3118
      gemini: {}

  - name: plain-tool
    work_only: false
    command: echo
    args:
      - plain
