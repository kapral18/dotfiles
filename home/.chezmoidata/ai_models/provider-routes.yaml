# Direct provider routes: completions reachable without the gateway.
# One section of the model registry, split across .chezmoidata/ai_models/ for navigation only:
# chezmoi merges every file under .chezmoidata/ (subdirectories included) into one flat data
# namespace, so `.cursor_models` and `.model_bands` still resolve the same in templates.
# scripts/ai_models.py maps each section back to its file; add a section there when adding one here.

# Provider-route completion policy. `azure-foundry` and `llama-cpp` are derived from their
# canonical registries or configs; only explicit remote-route fallbacks are listed here.
provider_models:
  # OpenRouter is a strict four-model route. deepseek-v4-flash-0731 carries every default and
  # lane at max effort with FP8-or-higher quantization and a 24 t/s preferred floor; `sort` is
  # omitted so OpenRouter's default load balancer keeps uptime (recent-outage providers last)
  # then price-weights remaining endpoints. moonshotai/kimi-k3 remains selectable and only
  # allows Fireworks, Together, and BaseTen under a $16/M completion cap (`only` blocks other
  # providers). z-ai/glm-5.2 is selectable alongside with the same FP8-or-higher, 24 t/s floor
  # policy as deepseek; gpt-5.6-terra carries counters.
  # Pi injects the deepseek/kimi policies through modelOverrides openRouterRouting and OMP through
  # modelOverrides extraBody.provider. Harnesses without an extra-body channel carry them in the
  # `kimi-lanes*`, `deepseek-lanes-*`, and `glm-lanes-*` workspace preset slugs. Keeping other
  # provider entries here
  # would expose them through generated pickers and bypass the route policy.
  - provider: "openrouter"
    id: "deepseek/deepseek-v4-flash-0731"
    recommended: true
  - provider: "openrouter"
    id: "moonshotai/kimi-k3"
  - provider: "openrouter"
    id: "z-ai/glm-5.2"
  - provider: "openrouter"
    id: "openai/gpt-5.6-terra"
  - provider: "vertex"
    id: "gemini-3.6-flash"
    backend: "gemini-chat"
    wire_model: "google/gemini-3.6-flash"
    efforts: "minimal,low,medium,high"
    default_effort: "medium"
    thinking_default: "medium"
    supports_no_thinking: false
    adapter_default: true
    context_window: 1048576
    max_output_tokens: 65536
    recommended: true
  - provider: "vertex"
    id: "gemini-3.1-pro-preview"
    backend: "gemini-chat"
    wire_model: "google/gemini-3.1-pro-preview"
    efforts: "low,medium,high"
    default_effort: "high"
    thinking_default: "high"
    supports_no_thinking: false
    context_window: 1048576
    max_output_tokens: 65536
    recommended: true
  - provider: "vertex"
    id: "claude-opus-4-6"
    backend: "claude-raw"
    wire_model: "claude-opus-4-6"
    efforts: "low,medium,high,max"
    default_effort: "none"
    thinking_default: "high"
    supports_no_thinking: true
    context_window: 1000000
    max_output_tokens: 128000
    recommended: true
  - provider: "vertex"
    id: "claude-opus-4-7"
    backend: "claude-raw"
    wire_model: "claude-opus-4-7"
    efforts: "low,medium,high,xhigh,max"
    default_effort: "none"
    thinking_default: "high"
    supports_no_thinking: true
    context_window: 1000000
    max_output_tokens: 128000
    recommended: true
