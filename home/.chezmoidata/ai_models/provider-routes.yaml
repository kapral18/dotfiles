# Direct provider routes: completions reachable without the gateway.
# One section of the model registry, split across .chezmoidata/ai_models/ for navigation only:
# chezmoi merges every file under .chezmoidata/ (subdirectories included) into one flat data
# namespace, so `.cursor_models` and `.category_models` still resolve the same in templates.
# scripts/ai_models.py maps each section back to its file; add a section there when adding one here.

# Provider-route completion policy. `azure-foundry` and `llama-cpp` are derived from their
# canonical registries or configs; only explicit remote-route fallbacks are listed here.
provider_models:
  # OpenRouter is a strict five-model route. z-ai/glm-5.3-flash carries every default and
  # lane at high effort with FP8-or-higher quantization and a 24 t/s preferred floor (it took the
  # defaults over from deepseek/deepseek-v4-flash-0731 on 2026-09-10, user call; DeepSeek stays
  # selectable as deepseek/deepseek-v4.1-flash, which replaced v4-flash-0731 on 2026-09-11, user call,
  # behind its own policy: a 35 t/s preferred floor under a $1.20/M completion cap and no quantization
  # filter, because few DeepSeek endpoints declare one); `sort` is omitted so OpenRouter's
  # default load balancer keeps uptime (recent-outage providers last) then price-weights remaining
  # endpoints. moonshotai/kimi-k3 remains selectable and only allows Fireworks, Together, and
  # BaseTen under a $16/M completion cap (`only` blocks other providers). z-ai/glm-5.2 is
  # selectable alongside with the same FP8-or-higher, 24 t/s floor policy; openai/gpt-5.6-terra
  # remains selectable.
  # Pi injects the GLM/DeepSeek/Kimi policies through modelOverrides openRouterRouting and OMP through
  # modelOverrides extraBody.provider. Harnesses without an extra-body channel carry them in the
  # `kimi-lanes*`, `deepseek-lanes-*`, and `glm-lanes-*` workspace preset slugs; the request model overrides the
  # preset's pinned model, so `z-ai/glm-5.3-flash@preset/glm-lanes-high` rides the GLM-5.2 slug
  # (live-probed 2026-09-10). Keeping other provider entries here
  # would expose them through generated pickers and bypass the route policy.
  - provider: "openrouter"
    id: "z-ai/glm-5.3-flash"
    recommended: true
  - provider: "openrouter"
    id: "deepseek/deepseek-v4.1-flash"
  - provider: "openrouter"
    id: "moonshotai/kimi-k3"
  - provider: "openrouter"
    id: "z-ai/glm-5.2"
  - provider: "openrouter"
    id: "openai/gpt-5.6-terra"
