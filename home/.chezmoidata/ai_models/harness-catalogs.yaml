# Per-harness model catalogs: what each harness's own picker can offer.
# One section of the model registry, split across .chezmoidata/ai_models/ for navigation only:
# chezmoi merges every file under .chezmoidata/ (subdirectories included) into one flat data
# namespace, so `.pi_extra_models` and `.category_models` still resolve the same in templates.
# scripts/ai_models.py maps each section back to its file; add a section there when adding one here.

# Pi's OpenRouter picker is a strict route. T1 (session/research/review) rides Pi's native
# anthropic session model `anthropic/claude-fable-5.1:high`, which is not an OpenRouter id and so is
# absent here. GPT-5.6 Sol carries both the T2 implement lane (:high) and refute (:xhigh) — one id,
# two efforts — after it superseded GPT-5.5 on 2026-09-07; GLM 5.3 Flash carries mechanical, and
# Gemini 3.8 Flash memory (the lane was live-probed on 3.7 Flash 2026-08-29 and moved to 3.8 Flash
# 2026-09-07; tops out at :high). DeepSeek V4.1 Flash (V4 Flash carried mechanical until 2026-09-10; the id moved to V4.1 on
# 2026-09-11, user call), Sonnet 4.6 (refute
# until the 2026-09-07 retier), Kimi and GLM-5.2 remain selectable without
# backing a category. GPT-6 Astra (Flex tier only) is the provider-only default.
# Pi resolves the `openrouter/` prefix through its own built-in provider, so no generated provider
# block backs these entries.
pi_extra_models:
  # Selectable through Pi's built-in github-copilot provider (GitHub Copilot subscription, not the
  # Copilot CLI); category/child selections remain independent of these ids.
  - id: "github-copilot/claude-fable-5.1"
  - id: "github-copilot/grok-4.6"
  - id: "github-copilot/gemini-3.8-flash"
  - id: "github-copilot/gpt-6-astra"
  # Pi default root and category lanes ride Pi's built-in ChatGPT-subscription `openai-codex` provider (user call 2026-09-30).
  - id: "openai-codex/gpt-6.1-sol"
    recommended: true
  - id: "openai-codex/gpt-6-luna"
  # Native Anthropic category model retained for the T1 research/review child rows.
  - id: "anthropic/claude-fable-5.1"
  - id: "openrouter/openai/gpt-5.6-sol"
  - id: "openrouter/z-ai/glm-5.3-flash"
  # Pi implement lane (`pi --list-models`: 1.0M context, 943.7K max output).
  - id: "openrouter/z-ai/glm-5.3"
  # Pi refute counter for the Muse Spark review lane (`pi --list-models`: 500K context, 450K max output).
  - id: "openrouter/x-ai/grok-4.6"
  - id: "openrouter/deepseek/deepseek-v4.1-flash"
  - id: "openrouter/google/gemini-3.8-flash"
  - id: "openrouter/anthropic/claude-sonnet-4.6"
  - id: "openrouter/moonshotai/kimi-k3"
  - id: "openrouter/z-ai/glm-5.2"
  # GPT-6 Astra on OpenRouter is pinned to OpenAI's Flex service tier through modelOverrides
  # `only: ["openai/flex"]` ($5/$25 per M, half the standard endpoint; base slugs never match service
  # tiers, so the explicit tag is required; live-probed 2026-09-11, user call).
  - id: "openrouter/openai/gpt-6-astra"
    recommended: true
  - id: "openrouter/meta/muse-spark-1.3"
