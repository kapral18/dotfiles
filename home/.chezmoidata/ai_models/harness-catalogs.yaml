# Per-harness model catalogs: what each harness's own picker can offer.
# One section of the model registry, split across .chezmoidata/ai_models/ for navigation only:
# chezmoi merges every file under .chezmoidata/ (subdirectories included) into one flat data
# namespace, so `.cursor_models` and `.category_models` still resolve the same in templates.
# scripts/ai_models.py maps each section back to its file; add a section there when adding one here.

# Harness policy consumed by the generated model mirror. `recommended` is the
# narrower curated pickers; omitted means curated but not recommended. Live
# availability never edits or promotes this policy.
