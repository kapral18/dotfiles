    refute:
      model: "openrouter/meta/muse-spark-1.3"
      effort: "max"
      thinking: ""
      context: "long"
      verifier_status: "cross_family"
    memory:
      model: "openrouter/z-ai/glm-5.3-flash"
      effort: "high"
      thinking: ""
      context: "short"
  # OMP `@role` tokens resolve through `modelRoles` in `readonly_config.yml.tmpl`.
  omp:
