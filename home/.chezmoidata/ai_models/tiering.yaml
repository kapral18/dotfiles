  k-agent-live-ui-review: "review"
  k-agent-post-review: "review"
  k-agent-pr-necessity-auditor: "review"
  k-agent-reviewer: "review"
  k-agent-review-worker: "review"
  k-agent-deep-review: "review"
  k-agent-review-controller: "review"
  k-agent-code-searcher: "research"
  k-agent-public-sources: "research"
  k-agent-mechanical: "mechanical"
  k-agent-implementer: "implement"
  k-agent-smol: "memory"
  Explore: "research"
  Plan: "research"
  claude: "implement"
  claude-code-guide: "research"
  general-purpose: "implement"
  explore: "research"
  task: "implement"
  research: "research"
  rubber-duck: "research"
  rem-agent: "research"
  code-review: "review"
  security-review: "review"
  explorer: "research"
  worker: "implement"
  default: "research"
  codebase_investigator: "research"
  cli_help: "mechanical"
  generalist: "implement"
  browser_agent: "implement"
  generalPurpose: "implement"
  cursor-guide: "research"
  bugbot: "review"
  best-of-n-runner: "implement"
  sonic: "mechanical"
  scout: "mechanical"
  reviewer: "review"
  security-reviewer: "review"

# Reachability fallback per harness. `generate_agent_bands.py` fails generation when a bound
# agent has no reachable profile on a harness unless that harness names its fallback here with
# a reason. `generic` is the harness-native type that carries the lane at dispatch; `none`
# means the harness exposes no generic type and profile-less pairs must never dispatch there.
binding_fallbacks:
  claude_code:
    generic: "general-purpose"
    reason: "Built-in and cross-harness native names (task, worker, sonic, ...) have no Claude profile; the hook carries them on the generic implement type."
  codex:
    generic: "worker"
    reason: "Deep-review/controller lanes and cross-harness native names have no Codex role file; the spawn_agent hook carries the registry pick on the generic worker type."
  cursor:
    generic: "generalPurpose"
    reason: "Cursor CLI never scans ~/.cursor/agents, so no profile is reachable by name; every lane rides the Task hook on the generic type. No leaf signal exists, so dispatch is attended only (SOP §3.7 row 4)."
  omp:
    generic: "task"
    reason: "The native-name task shim carries T2 implement; deep-review/implementer lanes without OMP profiles resolve through the blocking native task type."
  pi:
    generic: "none"
    reason: "Pi disables builtins and exposes no generic edit-capable type; profile-less pairs are other-harness native names that must never dispatch on Pi, and deep-review/review-worker lanes are covered by the k-agent-review-controller/k-agent-reviewer profiles."
  antigravity:
    generic: "generalist"
    reason: "No profile files exist; all lanes are dynamic define_subagent/invoke_subagent calls at the flash tier."

# `effort` is the harness-literal dial; `thinking: ""` means no separate toggle; `context` is a short/long window tier.
# `verifier_status` is one of cross_family, reduced_independence, or degraded.
category_models:
  # Claude Code uses hyphenated point versions only (`claude-sonnet-4-6`); dotted form 404s. `[1m]` selects the 1M window.
  claude_code:
    mechanical:
      model: "claude-sonnet-5"
      effort: "high"
      thinking: ""
      context: "long"
    research:
      model: "claude-opus-5-5[1m]"
      effort: "high"
      thinking: ""
      context: "long"
    implement:
      model: "claude-sonnet-5"
      effort: "xhigh"
      thinking: "off"
      context: "long"
    review:
      model: "claude-opus-5-5[1m]"
      effort: "high"
      thinking: ""
      context: "long"
    refute:
      model: "claude-opus-5-5[1m]"
      effort: "high"
      thinking: ""
      context: "long"
      verifier_status: "degraded"
    memory:
      model: "claude-sonnet-5"
      effort: "medium"
      thinking: "off"
      context: "short"
  codex:
    mechanical:
      model: "gpt-6-luna"
      effort: "high"
      thinking: ""
      context: "short"
    research:
      model: "gpt-6-sol"
      effort: "high"
      thinking: ""
      context: "short"
    implement:
      model: "gpt-6-sol"
      effort: "medium"
      thinking: ""
      context: "short"
    review:
      model: "gpt-6-sol"
      effort: "high"
      thinking: ""
      context: "short"
    refute:
      model: "gpt-6-sol"
      effort: "high"
      thinking: ""
      context: "short"
      verifier_status: "degraded"
    memory:
      model: "gpt-6-sol"
      effort: "high"
      thinking: ""
      context: "short"
  # Cursor rows use Task-resolver base ids; effort rides user config, not the id. `-fast` ids are a price tier, never a pick.
  cursor:
    mechanical:
      # because it's free on cursor
      model: "grok-4.6"
      effort: "medium"
      thinking: ""
      context: "long"
    research:
      model: "claude-opus-5-5"
      effort: "high"
      thinking: "off"
      context: "long"
    implement:
      model: "muse-spark-1.3"
      effort: "high"
      thinking: ""
      context: "long"
    review:
      model: "claude-opus-5-5"
      effort: "high"
      thinking: ""
      context: "long"
    refute:
      model: "muse-spark-1.3"
      effort: "max"
      thinking: ""
      context: "long"
      verifier_status: "cross_family"
    memory:
      model: "grok-4.6"
      effort: "medium"
      thinking: ""
      context: "short"
  # Antigravity effort is informational: `invoke_subagent` accepts only abstract tiers, so the
  # bands generator drops effort for this harness and lanes pass `flash`.
  antigravity:
    mechanical:
      model: "gemini-3.8-flash"
      effort: "low"
      thinking: ""
      context: "long"
    research:
      model: "gemini-3.8-flash"
      effort: "high"
      thinking: ""
      context: "long"
    implement:
      model: "gemini-3.8-flash"
      effort: "medium"
      thinking: ""
      context: "long"
    review:
      model: "gemini-3.8-flash"
      effort: "high"
      thinking: ""
      context: "long"
    refute:
      model: "gemini-3.8-flash"
      effort: "high"
      thinking: ""
      context: "long"
      verifier_status: "degraded"
    memory:
      model: "gemini-3.8-flash"
      effort: "low"
      thinking: ""
      context: "long"
  # Pi stores models without `:level`; `effort` renders as frontmatter `thinking`.
  pi:
    mechanical:
      model: "openrouter/z-ai/glm-5.3-flash"
      effort: "high"
      thinking: ""
      context: "long"
    research:
      model: "openrouter/z-ai/glm-5.3"
      effort: "max"
      thinking: ""
      context: "long"
    implement:
      model: "openrouter/z-ai/glm-5.3"
      effort: "high"
      thinking: ""
      context: "long"
    review:
      model: "openrouter/meta/muse-spark-1.3"
      effort: "max"
      thinking: ""
      context: "long"
    # Grok counters the Muse Spark review lane (user call 2026-09-13: flash refuters produced a false finding and skipped a packet step).
    refute:
      model: "openrouter/x-ai/grok-4.6"
      effort: "high"
      thinking: ""
      context: "short"
      verifier_status: "cross_family"
    memory:
      model: "openrouter/z-ai/glm-5.3-flash"
      effort: "high"
      thinking: ""
      context: "short"
  # OMP `@role` tokens resolve through `modelRoles` in `readonly_config.yml.tmpl`.
  omp:
    mechanical:
      model: "@smol"
      effort: "high"
      thinking: ""
      context: "short"
    research:
      model: "@default"
      effort: "high"
      thinking: ""
      context: "short"
    implement:
      model: "@task"
      effort: "medium"
      thinking: ""
      context: "short"
    review:
      model: "@default"
      effort: "high"
      thinking: ""
      context: "short"
    refute:
      model: "@advisor"
      effort: "high"
      thinking: ""
      context: "short"
      verifier_status: "degraded"
    memory:
      model: "@smol"
      effort: "high"
      thinking: ""
      context: "short"

# Alternate whole pricings for Pi only, selected per machine by `,pi-model-profile` (the active name
# lives in `${XDG_STATE_HOME:-$HOME/.local/state}/chezmoi/pi-model-profile`, outside this repo). `default` is a reserved name meaning
# `session_models.pi` + `category_models.pi` above; it must never appear as a key here, because those
# two sections are the shared schema every generator, projection, and OpenRouter wrapper reads.
# Profiles are full rows, not sparse overlays: every structural rule that holds for `category_models.pi`
# holds for each profile, so switching cannot silently drop a tier.
pi_model_profiles:
  # Everything on the local llama.cpp router (`,llama-cpp`): no subscription provider, no network.
  # Qwen3.6 35B-A3B UD-Q5_K_XL carries the session and every lane on one router ID.
  # Sharing that ID avoids loading separate thinking and instruct presets for this profile.
  local:
    session:
      model: "llama-cpp/qwen3.6-35b-a3b"
      effort: "off"
      context: "long"
    categories:
      mechanical:
        model: "llama-cpp/qwen3.6-35b-a3b"
        effort: "off"
        thinking: ""
        context: "long"
      research:
        model: "llama-cpp/qwen3.6-35b-a3b"
        effort: "off"
        thinking: ""
        context: "long"
      # Keep thinking off on the same Qwen router ID for every lane.
      # One model, one effort: implement has nothing to stay distinct from, so the distinctness
      # rule exempts single-model profiles.
      implement:
        model: "llama-cpp/qwen3.6-35b-a3b"
        effort: "off"
        thinking: ""
        context: "long"
      review:
        model: "llama-cpp/qwen3.6-35b-a3b"
        effort: "off"
        thinking: ""
        context: "long"
      # One model only, so the counter cannot be cross-family.
      refute:
        model: "llama-cpp/qwen3.6-35b-a3b"
        effort: "off"
        thinking: ""
        context: "long"
        verifier_status: "degraded"
      memory:
        model: "llama-cpp/qwen3.6-35b-a3b"
        effort: "off"
        thinking: ""
        context: "short"
  # Everything on OpenRouter `:free` variants: zero-cost, rate-limited upstream, and only as stable as
  # OpenRouter's free roster. `:free` is part of the model id, not a thinking level: Pi exact-matches
  # the id before it splits on the last colon, so `…:free:high` still resolves. Picks are the free ids
  # that completed a tool call through `pi` on 2026-09-18 (user call). Rejected that day: every
  # Nemotron, Inkling and Laguna free id (blocked by the account's OpenRouter free-model training
  # privacy setting), `z-ai/glm-5.2:free` (no tool-use endpoint), both MiniMax ids (no longer free),
  # Qwen3.8 27B and Gemma 4 31B (upstream 429).
  openrouter-free:
    session:
      model: "openrouter/deepseek/deepseek-v4-flash-0731:free"
      effort: "high"
      context: "long"
    categories:
      mechanical:
        model: "openrouter/nex-agi/nex-n2.5-mini:free"
        effort: "high"
        thinking: ""
        context: "long"
      research:
        model: "openrouter/deepseek/deepseek-v4-flash-0731:free"
        effort: "max"
        thinking: ""
        context: "long"
      # Nex N2.5 Pro keeps implement distinct from the session and mechanical picks and spreads load
      # across a second free rate-limit bucket.
      implement:
        model: "openrouter/nex-agi/nex-n2.5-pro:free"
        effort: "high"
        thinking: ""
        context: "long"
      review:
        model: "openrouter/deepseek/deepseek-v4-flash-0731:free"
        effort: "max"
        thinking: ""
        context: "long"
      # Nex counters the DeepSeek review lane: a different vendor family.
      refute:
        model: "openrouter/nex-agi/nex-n2.5-pro:free"
        effort: "high"
        thinking: ""
        context: "long"
        verifier_status: "cross_family"
      memory:
        model: "openrouter/nex-agi/nex-n2.5-mini:free"
        effort: "high"
        thinking: ""
        context: "short"
  # Everything on NVIDIA NIM's free hosted endpoints through Pi's built-in `nvidia` provider, keyed by
  # `NVIDIA_API_KEY` (fish exports it from the `nvidia/nim/api/token` pass entry). GLM 5.3 Flash is the
  # superior NIM model and the fastest endpoint probed (tool call in 1s direct, ~11s through `pi` at
  # high, xhigh and max). Every lane is free, so it carries all of them (user call 2026-09-19).
  # Not responding on NIM that day: GLM 5.3 and Kimi K3 (no bytes in 240s), DeepSeek V4 Pro and
  # MiniMax M3 (410), Kimi K2.6 (404). DeepSeek V4 Flash worked but was slow (87s per tool call).
  nvidia-free:
    session:
      model: "nvidia/z-ai/glm-5.3-flash"
      effort: "high"
      context: "long"
    categories:
      mechanical:
        model: "nvidia/z-ai/glm-5.3-flash"
        effort: "high"
        thinking: ""
        context: "long"
      research:
        model: "nvidia/z-ai/glm-5.3-flash"
        effort: "max"
        thinking: ""
        context: "long"
      # One model on every lane, so implement has nothing to stay distinct from (single-model rule).
      implement:
        model: "nvidia/z-ai/glm-5.3-flash"
        effort: "high"
        thinking: ""
        context: "long"
      review:
        model: "nvidia/z-ai/glm-5.3-flash"
        effort: "max"
        thinking: ""
        context: "long"
      # Same model as review, so the counter cannot be cross-family.
      refute:
        model: "nvidia/z-ai/glm-5.3-flash"
        effort: "high"
        thinking: ""
        context: "long"
        verifier_status: "degraded"
      memory:
        model: "nvidia/z-ai/glm-5.3-flash"
        effort: "high"
        thinking: ""
        context: "short"
  # Everything on the direct Anthropic provider; lanes mirror `category_models.claude_code`.
  anthropic:
    session:
      model: "anthropic/claude-opus-5-5"
      effort: "high"
      context: "long"
    categories:
      mechanical:
        model: "anthropic/claude-sonnet-5"
        effort: "high"
        thinking: ""
        context: "long"
      research:
        model: "anthropic/claude-opus-5-5"
        effort: "high"
        thinking: ""
        context: "long"
      implement:
        model: "anthropic/claude-opus-5"
        effort: "high"
        thinking: ""
        context: "long"
      review:
        model: "anthropic/claude-opus-5-5"
        effort: "high"
        thinking: ""
        context: "long"
      # One family only, so the counter cannot be cross-family (same call as `category_models.claude_code.refute`).
      refute:
        model: "anthropic/claude-opus-5-5"
        effort: "high"
        thinking: ""
        context: "long"
        verifier_status: "degraded"
      memory:
        model: "anthropic/claude-sonnet-5"
        effort: "medium"
        thinking: ""
        context: "short"
  # Everything on the ChatGPT-subscription `openai-codex` provider; lanes mirror `category_models.codex`.
  # All short: that provider only exposes short windows.
  codex:
    session:
      model: "openai-codex/gpt-6-sol"
      effort: "high"
      context: "short"
    categories:
      mechanical:
        model: "openai-codex/gpt-6-luna"
        effort: "high"
        thinking: ""
        context: "short"
      research:
        model: "openai-codex/gpt-6-sol"
        effort: "high"
        thinking: ""
        context: "short"
      implement:
        model: "openai-codex/gpt-6-sol"
        effort: "medium"
        thinking: ""
        context: "short"
      review:
        model: "openai-codex/gpt-6-sol"
        effort: "high"
        thinking: ""
        context: "short"
      # One family only, so the counter cannot be cross-family (same call as `category_models.codex.refute`).
      refute:
        model: "openai-codex/gpt-6-sol"
        effort: "high"
        thinking: ""
        context: "short"
        verifier_status: "degraded"
      memory:
        model: "openai-codex/gpt-6-sol"
        effort: "high"
        thinking: ""
        context: "short"
