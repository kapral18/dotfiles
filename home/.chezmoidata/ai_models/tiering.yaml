# Who runs on what: review-lane pins, work categories, agent bindings, per-harness bands.
# One section of the model registry, split across .chezmoidata/ai_models/ for navigation only:
# chezmoi merges every file under .chezmoidata/ (subdirectories included) into one flat data
# namespace, so `.cursor_models` and `.model_bands` still resolve the same in templates.
# scripts/ai_models.py maps each section back to its file; add a section there when adding one here.

# Sparse review-model overrides for harnesses whose review execution selectors cannot be
# derived from model_bands. For every other harness, review-agent-model.partial and
# scripts/ai_models.py resolve review roles through agent_bindings -> agent_categories ->
# model_bands, so model tweaks happen in one band row.
#
# lanes = generation angle lanes + auditors + controller. verifier = adversarial verifier,
# preferring a different model family than lanes at equal capability (capability outranks
# diversity, SOP §3.7; pairing is reviewed by a human here, not inferred at runtime).
# Empty value = the profile omits the field (harness config default). inherit = harness-native
# parent inheritance.
review_model_overrides:
  claude:
    # Claude sessions are launched on a deliberate model, so review profiles inherit the parent
    # session model instead of pinning model_bands.claude_code.max.model.
    lanes: "inherit"
    verifier: "inherit"
  gemini:
    # Antigravity's dynamic-subagent schema exposes abstract model tiers, not raw model ids.
    lanes: "pro"
    verifier: "pro"

# Model tiering is two independent dimensions plus sparse review overrides. `agent_categories`
# says what a kind of work needs and is portable — whether a findings audit needs max reasoning is
# a fact about the job, not about Copilot. `model_bands` says what a band resolves to and is the
# only place that knows Codex's catalog. `review_model_overrides` is only for harnesses whose review
# execution selector cannot be derived from model_bands. Full writeup: docs/topics/ai-assistants/model-tiering.md.
#
# Categories are chosen before the model: the SOP delegation section and the k-* skills name a
# category, the category names a band, and only then does the harness resolve a model id.
#
# `band` is an editorial cheap/standard/max judgment reviewed by a human here — NOT derived from a
# model's effort ladder or cost fields; harness catalogs share an identical minimal/low/medium/high
# shape across most models, so there is no per-model ladder to normalize against. The band
# exists so "high" on a cheap-band model and "high" on a max-band model are not read as equivalent
# effort just because the label string matches.
#
# `family` is primary or counter. Only `refute` is counter: a refutation lane preferably
# does not share a family with the work it audits — at equal capability — since same-family reviewers
# inherit the same blind spots and the same context contamination; capability still outranks diversity (SOP §3.7).
agent_categories:
  search:
    band: "cheap"
    family: "primary"
  mechanical:
    band: "cheap"
    family: "primary"
  research:
    band: "standard"
    family: "primary"
  implement:
    band: "standard"
    family: "primary"
  orchestrate:
    band: "max"
    family: "primary"
  review:
    band: "max"
    family: "primary"
  refute:
    band: "max"
    family: "counter"

# Every delegable agent name across every harness, mapped to its category. Names are the ones the
# harness itself uses, so built-ins (Copilot's `explore`, Codex's `worker`, Gemini's `generalist`,
# Cursor's `generalPurpose`) sit here next to the repo-authored profiles: a built-in that spawns on
# its own default model is exactly the leak this table exists to close.
#
# `general-purpose` is deliberately `implement`, not `search`, despite being the cheapest thing to
# reach for: it carries `tools: "*"` and is the only delegated agent that can edit anything.
#
# Investigation is `research`, not `search`. `search` is judgment-free recon by definition ("locate
# code, enumerate call sites, gather files. No edits, no judgment calls" — SOP 3.7), and the cheap
# band it maps to is for gruntwork a smarter model already scoped. Anything that forms and reports
# a conclusion — code-searcher, Explore, explore, explorer, codebase_investigator — is doing the
# judgment `search` excludes, and a weak model there produces confidently wrong recon that every
# downstream lane then builds on. `cli_help` is the one genuine `search` member: it reads `--help`
# and reports what it says.
agent_bindings:
  # Repo-authored review roles.
  adversarial-verifier: "refute"
  criteria-verifier: "refute"
  # `review`, not `refute`: fresh-eyes reads the diff blind for clarity, it does not audit a
  # conclusion, and its contract (k-review/references/fresh-eyes.md) pins it to the registry
  # LANES value. Binding it to `refute` pointed the band gate at the counter model while every
  # fresh-eyes profile rendered `lanes`, so profile and gate disagreed on the same agent.
  fresh-eyes: "review"
  change-auditor: "review"
  findings-auditor: "review"
  live-ui-review: "review"
  post-review: "review"
  pr-necessity-auditor: "review"
  reviewer: "review"
  review-worker: "review"
  deep-review: "orchestrate"
  review-controller: "orchestrate"
  # Repo-authored general roles.
  code-searcher: "research"
  researcher: "research"
  claude-code-guide: "research"
  # Claude Code built-ins the repo overrides.
  Explore: "research"
  Plan: "orchestrate"
  claude: "implement"
  general-purpose: "implement"
  # Copilot built-ins.
  explore: "research"
  task: "implement"
  research: "research"
  rubber-duck: "research"
  rem-agent: "research"
  code-review: "review"
  security-review: "review"
  # Codex built-ins.
  explorer: "research"
  worker: "implement"
  default: "orchestrate"
  # Gemini built-ins.
  codebase_investigator: "research"
  cli_help: "search"
  generalist: "implement"
  browser_agent: "implement"
  # Cursor built-ins (the Task tool's subagent_type enum).
  generalPurpose: "implement"
  cursor-guide: "research"
  bugbot: "review"
  best-of-n-runner: "implement"

# The per-harness half. `effort` is the literal value that harness takes (a model-id suffix on
# Cursor, --effort on Claude Code/Copilot, model_reasoning_effort on Codex, a `:level` suffix on
# Pi/OMP); `thinking` is on/off/"" where "" means the harness has no separate thinking toggle;
# `context` is short/long against the model's own window tier, not a token count.
#
# `context` is short by default everywhere: the long selector costs more per token and delegated
# lanes get a bounded context pack rather than whole trees. `long` appears only where the harness
# publishes no short variant of the wanted model — Cursor ships Opus 5, Sonnet 5 and GPT-5.5
# exclusively as 1M ids, so those rows record the window they actually get rather than a wish.
#
# `counter` is the cross-family refuter that the `refute` category resolves to. Omitting it is a
# real statement, not an oversight. By default the harness cannot field a second family, so
# refutation runs same-family and the controller reports `families=same (degraded)`.
# `verifier_status: reduced_independence` marks the deliberate same-family policy where capability
# beats diversity and the controller reports `families=same (reduced independence)` instead.
model_bands:
  claude_code:
    # Bare ids are the short-context selectors; `[1m]` is what buys the 1M window and no band asks
    # for it. Claude Code hyphenates point versions — `claude-sonnet-4.6` is the id its own 404 text
    # names as the typo. Unknown ids are not remapped, they reach the API as `API model not found`,
    # so no cross-vendor counter is expressible here. alwaysThinkingEnabled:false keeps the
    # max-band model non-thinking; that is what `thinking: "off"` means on this harness.
    #
    # Every band runs Fable 5 (user call, 2026-08-05, following the Cursor GPT-5.6 exit): cheap at
    # low effort, standard and max at medium effort. `claude-fable-5` is verified inside the
    # installed 2.1.222 bundle and `fable` is a first-class Agent-tool alias there. The API-key
    # route short-circuits on billing before model validation, so a live `-p` probe cannot prove
    # id validity on this machine. The cost-driven opus-5 ban exemption (closed 2026-08-03) is
    # superseded — opus is off this harness too. Claude Code is Anthropic-only, so the glm/terra/
    # kimi substitution chain does not apply here and the verifier stays families=same (degraded).
    #
    # All three bands share the `fable` alias, so the Claude gate's alias projection cannot
    # separate any of them; the profile frontmatter's exact id is what holds each band. That is the
    # same collision the two sonnet bands used to have, documented in band_gate.py `_claude`.
    cheap:
      model: "claude-fable-5"
      effort: "low"
      thinking: "off"
      context: "short"
    standard:
      model: "claude-fable-5"
      effort: "medium"
      thinking: "off"
      context: "short"
    max:
      model: "claude-fable-5"
      effort: "medium"
      thinking: "off"
      context: "short"
  codex:
    # User call 2026-08-14: every Codex band runs `gpt-5.6-sol` at xhigh effort (not high).
    # Keeping the three bands explicit lets the gate close native subagent defaults without
    # changing the portable category taxonomy. OpenAI-only, hence no counter (families=same degraded).
    # Bundled catalog (codex-cli 0.147.0): sol supports xhigh; native default is low, so the pin is
    # load-bearing.
    cheap:
      model: "gpt-5.6-sol"
      effort: "xhigh"
      thinking: ""
      context: "short"
    standard:
      model: "gpt-5.6-sol"
      effort: "xhigh"
      thinking: ""
      context: "short"
    max:
      model: "gpt-5.6-sol"
      effort: "xhigh"
      thinking: ""
      context: "short"
  copilot:
    # `context: short` is settings.json `contextTier: "default"`; long would be `"long_context"`.
    # Cost-driven pin (closed 2026-08-03): opus-5 and gpt-5.5 are punitively expensive for regular
    # lanes, so max runs gpt-5.6-terra and the cross-family counter runs claude-sonnet-4.6.
    # Non-thinking Anthropic models (sonnet here) still need COPILOT_DISABLE_ANTHROPIC_THINKING=1,
    # which the `,copilot` launcher exports; it zeroes the thinking budget while effortLevel
    # still ships as reasoning_effort.
    cheap:
      model: "claude-haiku-4.5"
      effort: "high"
      thinking: "off"
      context: "short"
    standard:
      model: "claude-sonnet-4.6"
      effort: "high"
      thinking: "off"
      context: "short"
    max:
      model: "gpt-5.6-terra"
      effort: "high"
      thinking: ""
      context: "short"
      counter:
        model: "claude-sonnet-4.6"
        effort: "high"
        thinking: "off"
        context: "short"
  cursor:
    # Cursor is the only harness that splits effort and thinking into separate ids (plain
    # `claude-fable-5-medium` vs `claude-fable-5-thinking-*`). Opus 5, Fable 5 and the GPT-5.6 ids
    # exist only as 1M ids here. `cursor-grok-4.6-xhigh` is not a 1M label in live
    # `cursor-agent models` (2026.08.11-e8db854: "Cursor Grok 4.6 Extra High").
    #
    # These bands are read by the band hook alone, and the Task tool takes a far narrower whitelist
    # than `cursor-agent models`. Live Task enum (Cursor IDE 2026-08-14): claude-fable-5-medium,
    # claude-opus-5-high, claude-sonnet-5-thinking-max, composer-2.5, composer-2.5-fast,
    # cursor-grok-4.5-high-fast, cursor-grok-4.6-xhigh, gpt-5.6-sol-xhigh, gpt-5.6-terra-xhigh.
    # Anything else fails the spawn with "Invalid model selection", so bands here must stay inside
    # that list even where a better id exists for a main session: kimi-k3 and
    # claude-fable-5-low/-max are sellable to a main session but are not on that whitelist.
    #
    # User call 2026-08-14: every Cursor band and both review-lane roles run cursor-grok-4.6-xhigh
    # (replaces gpt-5.6-terra-max / composer-2.5). No counter — the verifier follows the band, so
    # refutation runs families=same (reduced independence), a deliberate single-model policy.
    #
    # `-fast` is a speed tier, not a cheaper model: cursor.com/docs/models prices Composer 2.5 at
    # $0.5/$2.5 and calls the fast variant "A faster variant with the same intelligence ... at $3/M
    # input and $15/M output tokens". No band may reach for a `-fast` id.
    cheap:
      model: "cursor-grok-4.6-xhigh"
      effort: "xhigh"
      thinking: ""
      context: "short"
    standard:
      model: "cursor-grok-4.6-xhigh"
      effort: "xhigh"
      thinking: ""
      context: "short"
    max:
      model: "cursor-grok-4.6-xhigh"
      effort: "xhigh"
      thinking: ""
      context: "short"
      verifier_status: "reduced_independence"
  gemini:
    # Google-only catalog, so cheap, standard and max collapse to gemini-3.7-flash with high effort.
    cheap:
      model: "gemini-3.7-flash"
      effort: "high"
      thinking: ""
      context: "short"
    standard:
      model: "gemini-3.7-flash"
      effort: "high"
      thinking: ""
      context: "short"
    max:
      model: "gemini-3.7-flash"
      effort: "high"
      thinking: ""
      context: "short"
  pi:
    # Pi only ever reaches OpenRouter here. DeepSeek max carries all primary bands; the counter is
    # gpt-5.6-terra:max, so lanes vs counter stay genuinely cross-family.
    # The `:<level>` suffix is Pi's single dial (thinking level and reasoning effort at once).
    # Pi exposes no context tier at all, so every band is short by construction.
    cheap:
      model: "openrouter/deepseek/deepseek-v4-flash-0731:max"
      effort: "max"
      thinking: ""
      context: "short"
    standard:
      model: "openrouter/deepseek/deepseek-v4-flash-0731:max"
      effort: "max"
      thinking: ""
      context: "short"
    max:
      model: "openrouter/deepseek/deepseek-v4-flash-0731:max"
      effort: "max"
      thinking: ""
      context: "short"
      counter:
        model: "openrouter/openai/gpt-5.6-terra:max"
        effort: "max"
        thinking: ""
        context: "short"
  omp:
    # OMP is the one harness with native band indirection, so the bands are spelled as its own
    # `@role` tokens and readonly_config.yml.tmpl's `modelRoles` resolves them per profile. That
    # is what lets each profile decide what a role costs.
    # There is no counter (dropped 2026-08-06, user call): every profile resolves advisor to the
    # lanes' own model — work to openrouter/deepseek/deepseek-v4-flash-0731:max, personal to
    # cursor/cursor-grok-4.6-xhigh — and review lanes plus verifier stay on @default (same-family).
    # Verified 17.2.4: a profile carrying `model: "@smol"` runs on modelRoles.smol, and an
    # unknown token fails loudly with `Error: No model selected.` rather than falling back.
    # Same single-dial constraint as Pi: omp maps thinkingLevel straight onto reasoning, and
    # provider/model are separated by `/`, never `:` — `cursor:` parses as a bogus provider.
    cheap:
      model: "@smol"
      effort: "high"
      thinking: ""
      context: "short"
    standard:
      model: "@task"
      effort: "high"
      thinking: ""
      context: "short"
    max:
      model: "@default"
      effort: "high"
      thinking: ""
      context: "short"
      verifier_status: "reduced_independence"
