# Chezmoi merges `.chezmoidata/**` flat; `scripts/ai_models.py` maps sections to files.

# Root/main-session pick per harness: the model the user talks to.
# Never a delegation target.
session_models:
  claude_code:
    model: "claude-fable-5-1[1m]"
    effort: "high"
    context: "long"
  codex:
    model: "gpt-6-astra"
    effort: "high"
    context: "short"
  copilot:
    model: "claude-fable-5.1"
    effort: "high"
    context: "long"
  # session row is informational: Cursor's root model/effort live in Cursor saved user config, not in this repo
  cursor:
    model: "claude-fable-5-1"
    effort: "high"
    context: "long"
  antigravity:
    model: "gemini-3.8-flash"
    effort: "high"
    context: "long"
  pi:
    model: "github-copilot/claude-fable-5.1"
    effort: "high"
    context: "long"
  omp:
    model: "anthropic/claude-fable-5.1"
    effort: "high"
    context: "short"
agent_categories:
  mechanical:
    family: "primary"
    contract: "deterministic-edit-or-exact-retrieval"
  research:
    family: "primary"
    contract: "evidence-synthesis"
  implement:
    family: "primary"
    contract: "implementation"
  review:
    family: "primary"
    contract: "review"
  # Counter family prefers a different family at equal capability; capability outranks diversity (SOP §3.7).
  refute:
    family: "counter"
    contract: "adversarial-verification"
  memory:
    family: "primary"
    contract: "memory-operations"
# Built-in names are each harness's own; edit-capable generics (`general-purpose`, `claude`)
# are `implement`, not `mechanical`.
agent_bindings:
  k-agent-adversarial-verifier: "refute"
  k-agent-criteria-verifier: "refute"
  k-agent-claim-verifier: "refute"
  k-agent-fresh-eyes: "review"
  k-agent-change-auditor: "review"
  k-agent-findings-auditor: "review"
  k-agent-live-ui-review: "review"
  k-agent-post-review: "review"
  k-agent-pr-necessity-auditor: "review"
  k-agent-reviewer: "review"
  k-agent-review-worker: "review"
  k-agent-deep-review: "research"
  k-agent-review-controller: "research"
  k-agent-code-searcher: "research"
  k-agent-public-sources: "research"
  k-agent-mechanical: "mechanical"
  k-agent-implementer: "implement"
  k-agent-smol: "memory"
  Explore: "research"
  Plan: "research"
  claude: "implement"
  claude-code-guide: "research"
  general-purpose: "implement"
  explore: "research"
  task: "implement"
  research: "research"
  rubber-duck: "research"
  rem-agent: "research"
  code-review: "review"
  security-review: "review"
  explorer: "research"
  worker: "implement"
  default: "research"
  codebase_investigator: "research"
  cli_help: "mechanical"
  generalist: "implement"
  browser_agent: "implement"
  generalPurpose: "implement"
  cursor-guide: "research"
  bugbot: "review"
  best-of-n-runner: "implement"
  sonic: "mechanical"
  scout: "mechanical"
  reviewer: "review"
  security-reviewer: "review"

# `effort` is the harness-literal dial; `thinking: ""` means no separate toggle; `context` is a short/long window tier.
# `verifier_status` is one of cross_family, reduced_independence, or degraded.
category_models:
  # Claude Code uses hyphenated point versions only (`claude-sonnet-4-6`); dotted form 404s. `[1m]` selects the 1M window.
  claude_code:
    mechanical:
      model: "claude-sonnet-4-6[1m]"
      effort: "high"
      thinking: ""
      context: "long"
    research:
      model: "claude-fable-5-1[1m]"
      effort: "high"
      thinking: ""
      context: "long"
    implement:
      model: "claude-opus-5[1m]"
      effort: "high"
      thinking: "off"
      context: "long"
    review:
      model: "claude-fable-5-1[1m]"
      effort: "high"
      thinking: ""
      context: "long"
    refute:
      model: "claude-fable-5-1[1m]"
      effort: "high"
      thinking: ""
      context: "long"
      verifier_status: "degraded"
    memory:
      model: "claude-sonnet-5"
      effort: "medium"
      thinking: "off"
      context: "short"
  codex:
    mechanical:
      model: "gpt-5.6-luna"
      effort: "high"
      thinking: ""
      context: "short"
    research:
      model: "gpt-6-astra"
      effort: "high"
      thinking: ""
      context: "short"
    implement:
      model: "gpt-5.6-terra"
      effort: "high"
      thinking: ""
      context: "short"
    review:
      model: "gpt-6-astra"
      effort: "high"
      thinking: ""
      context: "short"
    refute:
      model: "gpt-5.6-sol"
      effort: "high"
      thinking: ""
      context: "short"
      verifier_status: "degraded"
    memory:
      model: "gpt-5.6-terra"
      effort: "high"
      thinking: ""
      context: "short"
  copilot:
    mechanical:
      model: "grok-4.6"
      effort: "medium"
      thinking: ""
      context: "long"
    research:
      model: "claude-fable-5.1"
      effort: "high"
      thinking: "off"
      context: "long"
    implement:
      model: "grok-4.6"
      effort: "high"
      thinking: ""
      context: "long"
    review:
      model: "claude-fable-5.1"
      effort: "high"
      thinking: ""
      context: "long"
    refute:
      model: "kimi-k3"
      effort: "high"
      thinking: ""
      context: "long"
      verifier_status: "cross_family"
    memory:
      model: "grok-4.6"
      effort: "medium"
      thinking: ""
      context: "short"
  # Cursor rows use Task-resolver base ids; effort rides user config, not the id. `-fast` ids are a price tier, never a pick.
  cursor:
    mechanical:
      # because it's free on cursor
      model: "grok-4.6"
      effort: "medium"
      thinking: ""
      context: "long"
    research:
      model: "claude-fable-5-1"
      effort: "high"
      thinking: "off"
      context: "long"
    implement:
      model: "muse-spark-1.3"
      effort: "high"
      thinking: ""
      context: "long"
    review:
      model: "claude-fable-5-1"
      effort: "high"
      thinking: ""
      context: "long"
    refute:
      model: "muse-spark-1.3"
      effort: "max"
      thinking: ""
      context: "long"
      verifier_status: "cross_family"
    memory:
      model: "grok-4.6"
      effort: "medium"
      thinking: ""
      context: "short"
  antigravity:
    mechanical:
      model: "gemini-3.8-flash"
      effort: "low"
      thinking: ""
      context: "long"
    research:
      model: "gemini-3.8-flash"
      effort: "high"
      thinking: ""
      context: "long"
    implement:
      model: "gemini-3.8-flash"
      effort: "medium"
      thinking: ""
      context: "long"
    review:
      model: "gemini-3.8-flash"
      effort: "high"
      thinking: ""
      context: "long"
    refute:
      model: "gemini-3.8-flash"
      effort: "high"
      thinking: ""
      context: "long"
      verifier_status: "degraded"
    memory:
      model: "gemini-3.8-flash"
      effort: "low"
      thinking: ""
      context: "long"
  # Pi stores models without `:level`; `effort` renders as frontmatter `thinking`.
  pi:
    mechanical:
      model: "openrouter/z-ai/glm-5.3-flash"
      effort: "high"
      thinking: ""
      context: "long"
    research:
      model: "github-copilot/claude-fable-5.1"
      effort: "high"
      thinking: ""
      context: "long"
    implement:
      model: "openrouter/meta/muse-spark-1.3"
      effort: "high"
      thinking: ""
      context: "long"
    review:
      model: "github-copilot/claude-fable-5.1"
      effort: "high"
      thinking: ""
      context: "long"
    # Counter family for the Anthropic review lane (user call 2026-09-13: flash refuters produced a false finding and skipped a packet step).
    refute:
      model: "openrouter/meta/muse-spark-1.3"
      effort: "max"
      thinking: ""
      context: "long"
      verifier_status: "cross_family"
    memory:
      model: "openrouter/z-ai/glm-5.3-flash"
      effort: "high"
      thinking: ""
      context: "short"
  # OMP `@role` tokens resolve through `modelRoles` in `readonly_config.yml.tmpl`.
  omp:
    mechanical:
      model: "@smol"
      effort: "high"
      thinking: ""
      context: "short"
    research:
      model: "@default"
      effort: "high"
      thinking: ""
      context: "short"
    implement:
      model: "@task"
      effort: "high"
      thinking: ""
      context: "short"
    review:
      model: "@default"
      effort: "high"
      thinking: ""
      context: "short"
    refute:
      model: "@advisor"
      effort: "high"
      thinking: ""
      context: "short"
      verifier_status: "cross_family"
    memory:
      model: "@smol"
      effort: "high"
      thinking: ""
      context: "short"
