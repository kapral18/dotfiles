# Who runs on what: review-lane pins, work categories, agent bindings, per-harness bands.
# One section of the model registry, split across .chezmoidata/ai_models/ for navigation only:
# chezmoi merges every file under .chezmoidata/ (subdirectories included) into one flat data
# namespace, so `.cursor_models` and `.category_models` still resolve the same in templates.
# scripts/ai_models.py maps each section back to its file; add a section there when adding one here.

# Sparse review-model overrides for harnesses whose review execution selectors cannot be
# derived from category_models. For every other harness, review-agent-model.partial and
# scripts/ai_models.py resolve review roles through agent_bindings -> agent_categories ->
# category_models, so model tweaks happen in one category row.
#
# lanes = generation angle lanes + auditors + controller. verifier = adversarial verifier,
# preferring a different model family than lanes at equal capability (capability outranks
# diversity, SOP §3.7; pairing is reviewed by a human here, not inferred at runtime).
# Empty value = the profile omits the field (harness config default). inherit = harness-native
# parent inheritance.
review_model_overrides:
  claude:
    # Claude sessions are launched on a deliberate model, so review profiles inherit the parent
    # session model instead of pinning category_models.claude_code.review.model.
    lanes: "inherit"
    verifier: "inherit"
  gemini:
    # Antigravity's dynamic-subagent schema exposes abstract model tiers, not raw model ids.
    lanes: "pro"
    verifier: "pro"
  copilot:
    # Cross-family primary-finder lane (`lanes_cross` slot): Copilot review runs GPT-5.5, so the
    # cross lane takes the Anthropic pick — same id as the refute row. Recall evidence: most
    # confirmed defects are caught by exactly one reviewer perspective, so the always-on correctness
    # lane gets family diversity before any angle fan-out.
    lanes_cross: "claude-fable-5"
  cursor:
    # Cross-family primary-finder lane: Cursor review runs GPT-5.6 SOL, so the cross lane takes
    # Opus 5 High (Task-enum whitelisted, long-context task id like the refute row).
    lanes_cross: "claude-opus-5-high"
# claude_code and codex are single-vendor catalogs: no lanes_cross entry exists, so an aux-slot
# lookup falls back to `lanes` (or the category pick) and the flow reports finder_family degraded.

# Model routing is two independent dimensions plus sparse review overrides. `agent_categories`
# says what a kind of work needs and is portable — whether a findings audit needs top reasoning is
# a fact about the job, not about Copilot. `category_models` says what each category resolves to
# for each harness and is the only place that knows Codex's catalog. `review_model_overrides` is only
# for harnesses whose review execution selector cannot be derived from category_models. Full writeup:
# docs/topics/ai-assistants/model-tiering.md.
#
# Categories are chosen before the model: the SOP delegation section and the k-* skills name a
# category, then category_models resolves that category to a harness-native model id.
#
# Category rows are explicit because work type and model cost are not interchangeable. `lookup`
# is exact retrieval only; semantic discovery and any conclusion-forming investigation uses `research`.
#
# `family` is primary or counter. Only `refute` is counter: a refutation lane preferably
# does not share a family with the work it audits — at equal capability — since same-family reviewers
# inherit the same blind spots and the same context contamination; capability still outranks diversity (SOP §3.7).
agent_categories:
  lookup:
    family: "primary"
    contract: "exact-retrieval"
  mechanical:
    family: "primary"
    contract: "deterministic-edit"
  research:
    family: "primary"
    contract: "evidence-synthesis"
  implement:
    family: "primary"
    contract: "implementation"
  orchestrate:
    family: "primary"
    contract: "orchestration"
  review:
    family: "primary"
    contract: "review"
  refute:
    family: "counter"
    contract: "adversarial-verification"
  # Bounded judgment and `,ai-kb` operation over caller-scoped inputs (staged recall candidates,
  # one-line insights): the work is small-context and latency-sensitive, so the category resolves
  # to each harness's small/fast pick, never the research/implement tiers.
  memory:
    family: "primary"
    contract: "memory-operations"

# Every delegable agent name across every harness, mapped to its category. Names are the ones the
# harness itself uses, so built-ins (Copilot's `explore`, Codex's `worker`, Gemini's `generalist`,
# Cursor's `generalPurpose`) sit here next to the repo-authored profiles: a built-in that spawns on
# its own default model is exactly the leak this table exists to close.
#
# `general-purpose` is deliberately `implement`, not `lookup`, despite being the cheapest thing to
# reach for: it carries `tools: "*"` and is the only delegated agent that can edit anything.
#
# Investigation is `research`, not `lookup`. `lookup` is exact retrieval by a smarter caller:
# read the CLI help text, list the requested filenames, or return caller-scoped raw pointers.
# Anything that discovers relevant code, chooses symbols, or forms and reports a conclusion —
# code-searcher, Explore, explore, explorer, codebase_investigator — is doing `research`.
# `cli_help` is the one genuine `lookup` member: it reads `--help` and reports what it says.
agent_bindings:
  # Repo-authored review roles.
  adversarial-verifier: "refute"
  criteria-verifier: "refute"
  # `review`, not `refute`: fresh-eyes reads the diff blind for clarity, it does not audit a
  # conclusion, and its contract (k-review/references/fresh-eyes.md) pins it to the registry
  # LANES value. Binding it to `refute` pointed the band gate at the counter model while every
  # fresh-eyes profile rendered `lanes`, so profile and gate disagreed on the same agent.
  fresh-eyes: "review"
  change-auditor: "review"
  findings-auditor: "review"
  live-ui-review: "review"
  post-review: "review"
  pr-necessity-auditor: "review"
  reviewer: "review"
  review-worker: "review"
  # Cross-family primary-finder lane; same `review` category, rendered through the `lanes_cross`
  # override slot so single-vendor harnesses fall back to the standard lane model.
  review-worker-cross: "review"
  deep-review: "orchestrate"
  review-controller: "orchestrate"
  # Repo-authored general roles.
  code-searcher: "research"
  researcher: "research"
  claude-code-guide: "research"
  # ,ai-kb operator: judges staged per-turn recall candidates against session state and owns
  # capsule write mechanics (k-ai-kb/references/smol-operator.md).
  smol: "memory"
  # Claude Code built-ins the repo overrides.
  Explore: "research"
  Plan: "orchestrate"
  claude: "implement"
  general-purpose: "implement"
  # Copilot built-ins.
  explore: "research"
  task: "implement"
  research: "research"
  rubber-duck: "research"
  rem-agent: "research"
  code-review: "review"
  security-review: "review"
  # Codex built-ins.
  explorer: "research"
  worker: "implement"
  default: "orchestrate"
  # Gemini built-ins.
  codebase_investigator: "research"
  cli_help: "lookup"
  generalist: "implement"
  browser_agent: "implement"
  # Cursor built-ins (the Task tool's subagent_type enum).
  generalPurpose: "implement"
  cursor-guide: "research"
  bugbot: "review"
  best-of-n-runner: "implement"

# The per-harness half. `effort` is the literal value that harness takes (a model-id suffix on
# Cursor, --effort on Claude Code/Copilot, model_reasoning_effort on Codex, a `:level` suffix on
# Pi/OMP); `thinking` is on/off/"" where "" means the harness has no separate thinking toggle;
# `context` is short/long against the model's own window tier, not a token count.
#
# `context` is short by default everywhere: the long selector costs more per token and delegated
# lanes get a bounded context pack rather than whole trees. `long` appears only where the harness
# publishes no short variant of the wanted model — Cursor ships Opus 5, Sonnet 5 and GPT-5.5
# exclusively as 1M ids, so those rows record the window they actually get rather than a wish.
#
# `refute` is the adversarial verification category. `verifier_status: cross_family` means it uses
# a different model family from `review`; `reduced_independence` marks deliberate same-family
# capability-first verification; `degraded` means the harness has no better second-family route.
category_models:
  claude_code:
    # Bare ids are the short-context selectors; `[1m]` is what buys the 1M window and no category asks
    # for it. Claude Code hyphenates point versions — `claude-sonnet-4.6` is the id its own 404 text
    # names as the typo. Unknown ids are not remapped, they reach the API as `API model not found`,
    # so no cross-vendor counter is expressible here. alwaysThinkingEnabled:false keeps the
    # top-category model non-thinking; that is what `thinking: "off"` means on this harness.
    #
    # Fable 5 carries lookup and conclusion-forming categories (user call, 2026-08-05, following
    # the Cursor GPT-5.6 exit); mechanical work uses Claude Sonnet 4.6 high. Claude Code hyphenates the
    # version selector as `claude-sonnet-4-6` (not Copilot's dotted `claude-sonnet-4.6`). The API-key
    # route short-circuits on billing before model validation, so a live `-p` probe cannot prove id
    # validity on this machine. The cost-driven opus-5 ban exemption (closed 2026-08-03) is superseded
    # — opus is off this harness too. Claude Code is Anthropic-only, so the glm/terra/kimi
    # substitution chain does not apply here and the verifier stays families=same (degraded).
    #
    # All categories share the `fable` alias, so the Claude gate's alias projection cannot
    # separate all of them; the profile frontmatter's exact id is what holds each category. That is the
    # same collision the two sonnet bands used to have, documented in band_gate.py `_claude`.
    lookup:
      model: "claude-fable-5"
      effort: "low"
      thinking: "off"
      context: "short"
    mechanical:
      model: "claude-sonnet-4-6"
      effort: "high"
      thinking: "off"
      context: "short"
    research:
      model: "claude-fable-5"
      effort: "medium"
      thinking: "off"
      context: "short"
    implement:
      model: "claude-fable-5"
      effort: "medium"
      thinking: "off"
      context: "short"
    orchestrate:
      model: "claude-fable-5"
      effort: "medium"
      thinking: "off"
      context: "short"
    review:
      model: "claude-fable-5"
      effort: "medium"
      thinking: "off"
      context: "short"
    refute:
      model: "claude-fable-5"
      effort: "medium"
      thinking: "off"
      context: "short"
      verifier_status: "degraded"
    # memory: smallest verified id in this catalog; low effort is verified claude syntax (lookup row).
    memory:
      model: "claude-sonnet-4-6"
      effort: "low"
      thinking: "off"
      context: "short"
  codex:
    # User call 2026-08-24: Codex mechanical uses `gpt-5.4` at high effort; every other Codex
    # category runs `gpt-5.5` at xhigh effort. Keeping every category explicit lets the gate close
    # native subagent defaults. OpenAI-only, hence refute reports families=same degraded.
    # Bundled catalog (codex-cli 0.149.0): gpt-5.4 supports high but is hidden and carries an
    # upgrade note to gpt-5.6-terra; this row is a deliberate user policy.
    # Bundled catalog (codex-cli 0.149.0): gpt-5.5 supports xhigh; native default is low, so the
    # pin is load-bearing.
    lookup:
      model: "gpt-5.5"
      effort: "xhigh"
      thinking: ""
      context: "short"
    mechanical:
      model: "gpt-5.4"
      effort: "high"
      thinking: ""
      context: "short"
    research:
      model: "gpt-5.5"
      effort: "xhigh"
      thinking: ""
      context: "short"
    implement:
      model: "gpt-5.5"
      effort: "xhigh"
      thinking: ""
      context: "short"
    orchestrate:
      model: "gpt-5.5"
      effort: "xhigh"
      thinking: ""
      context: "short"
    review:
      model: "gpt-5.5"
      effort: "xhigh"
      thinking: ""
      context: "short"
    refute:
      model: "gpt-5.5"
      effort: "xhigh"
      thinking: ""
      context: "short"
      verifier_status: "degraded"
    # memory: reuses the verified mechanical pair (gpt-5.4/high); lower efforts unverified on this catalog.
    memory:
      model: "gpt-5.4"
      effort: "high"
      thinking: ""
      context: "short"
  copilot:
    # `context: short` is settings.json `contextTier: "default"`; long would be `"long_context"`.
    # User call 2026-08-24: Copilot defaults to gpt-5.5 at xhigh effort for every category except
    # mechanical and refute. Mechanical uses Sonnet 4.6 high; refute uses Fable 5 high.
    # Non-thinking Anthropic models still need COPILOT_DISABLE_ANTHROPIC_THINKING=1, which the
    # `,copilot` launcher exports; it zeroes the thinking budget while effortLevel still ships as
    # reasoning_effort.
    lookup:
      model: "gpt-5.5"
      effort: "xhigh"
      thinking: ""
      context: "short"
    mechanical:
      model: "claude-sonnet-4.6"
      effort: "high"
      thinking: "off"
      context: "short"
    research:
      model: "gpt-5.5"
      effort: "xhigh"
      thinking: ""
      context: "short"
    implement:
      model: "gpt-5.5"
      effort: "xhigh"
      thinking: ""
      context: "short"
    orchestrate:
      model: "gpt-5.5"
      effort: "xhigh"
      thinking: ""
      context: "short"
    review:
      model: "gpt-5.5"
      effort: "xhigh"
      thinking: ""
      context: "short"
    refute:
      model: "claude-fable-5"
      effort: "high"
      thinking: "off"
      context: "short"
      verifier_status: "cross_family"
    # memory: reuses the verified mechanical pair (claude-sonnet-4.6/high, catalog-checked by invariants).
    memory:
      model: "claude-sonnet-4.6"
      effort: "high"
      thinking: "off"
      context: "short"
  cursor:
    # Cursor is the only harness that splits effort and thinking into separate ids (plain
    # `claude-fable-5-medium` vs `claude-fable-5-thinking-*`). Opus 5, Fable 5 and the GPT-5.x ids
    # exist only as 1M ids here. `cursor-grok-4.6-xhigh` is not a 1M label in live
    # `cursor-agent models` (2026.08.21-4bf0f61: "Cursor Grok 4.6 Extra High").
    #
    # These categories are read by the band hook alone, and the Task tool takes a far narrower whitelist
    # than `cursor-agent models`. Live Task enum (probed 2026-08-29, cursor-agent 2026.08.28-a7f9513,
    # via Task-spawn "Invalid model selection" rejection listing): claude-fable-5-high,
    # claude-opus-5-high, claude-sonnet-5-thinking-max, composer-2.5, composer-2.5-fast,
    # cursor-grok-4.5-high-fast, cursor-grok-4.6-xhigh-fast, gemini-3.7-flash-high,
    # gpt-5.6-sol-high, gpt-5.6-terra-max.
    # Anything else fails the spawn with "Invalid model selection", so categories here must stay inside
    # that list even where a better id exists for a main session: kimi-k3 and
    # claude-fable-5-low/-max are sellable to a main session but are not on that whitelist.
    #
    # User call 2026-08-24 (remapped 2026-08-29 after the Task enum rotated): match Copilot's default
    # shape where the Cursor Task enum can spawn it. Primary categories use GPT-5.6 SOL High
    # (sol-xhigh left the enum), refute uses Opus 5 High. The primary/refute rows are long-context
    # task ids.
    #
    # User call 2026-08-30: the cheap lanes (mechanical, memory) use `auto` and let Cursor route
    # between Composer/Grok/other small models. `auto` is a router selector, not a catalog model:
    # it is absent from the Task rejection listing above but a live Task spawn with model "auto"
    # (unbound subagent_type, so the band gate stayed no-op) was accepted and ran
    # (probed 2026-08-30, cursor-agent 2026.08.28-a7f9513); caller-supplied models are validated
    # before hook rewrites apply (harness-capabilities), so that probe exercises the real enum.
    # Interactive `cursor-agent --model auto` completed a full turn in a tmux probe the same day,
    # and `cursor-agent models` lists `auto - Auto (default)`.
    #
    # `-fast` is a speed tier, not a cheaper model: cursor.com/docs/models prices Composer 2.5 at
    # $0.5/$2.5 and calls the fast variant "A faster variant with the same intelligence ... at $3/M
    # input and $15/M output tokens". No category may reach for a `-fast` id.
    lookup:
      model: "gpt-5.6-sol-high"
      effort: "high"
      thinking: ""
      context: "long"
    mechanical:
      model: "auto"
      effort: ""
      thinking: ""
      context: "short"
    research:
      model: "gpt-5.6-sol-high"
      effort: "high"
      thinking: ""
      context: "long"
    implement:
      model: "gpt-5.6-sol-high"
      effort: "high"
      thinking: ""
      context: "long"
    orchestrate:
      model: "gpt-5.6-sol-high"
      effort: "high"
      thinking: ""
      context: "long"
    review:
      model: "gpt-5.6-sol-high"
      effort: "high"
      thinking: ""
      context: "long"
    refute:
      model: "claude-opus-5-high"
      effort: "high"
      thinking: ""
      context: "long"
      verifier_status: "cross_family"
    # memory: `auto` (user call 2026-08-30) — Cursor's router picks the small model; probes above.
    memory:
      model: "auto"
      effort: ""
      thinking: ""
      context: "short"
  gemini:
    # Google-only catalog, so refute reports degraded. User call 2026-08-24: use Gemini 3.1 Pro
    # everywhere except mechanical, which stays on Gemini 3.7 Flash. Antigravity 1.1.18 spells
    # Gemini 3.1 Pro as `gemini-3.1-pro-preview` in `agy models`. All Gemini categories request
    # long context.
    lookup:
      model: "gemini-3.1-pro-preview"
      effort: "high"
      thinking: ""
      context: "long"
    mechanical:
      model: "gemini-3.7-flash"
      effort: "high"
      thinking: ""
      context: "long"
    research:
      model: "gemini-3.1-pro-preview"
      effort: "high"
      thinking: ""
      context: "long"
    implement:
      model: "gemini-3.1-pro-preview"
      effort: "high"
      thinking: ""
      context: "long"
    orchestrate:
      model: "gemini-3.1-pro-preview"
      effort: "high"
      thinking: ""
      context: "long"
    review:
      model: "gemini-3.1-pro-preview"
      effort: "high"
      thinking: ""
      context: "long"
    refute:
      model: "gemini-3.1-pro-preview"
      effort: "high"
      thinking: ""
      context: "long"
      verifier_status: "degraded"
    # memory: flash is the small Google pick, same verified pair as mechanical.
    memory:
      model: "gemini-3.7-flash"
      effort: "high"
      thinking: ""
      context: "long"
  pi:
    # Pi only ever reaches OpenRouter here. User call 2026-08-24: primary categories use GPT-5.5
    # at xhigh thinking, mechanical uses DeepSeek V4 Flash at xhigh, and refute uses Claude Sonnet
    # 4.6 at xhigh so lanes vs counter stay genuinely cross-family.
    # The `:<level>` suffix is Pi's single dial (thinking level and reasoning effort at once).
    # Pi exposes no context tier at all, so every category is short by construction.
    lookup:
      model: "openrouter/openai/gpt-5.5:xhigh"
      effort: "xhigh"
      thinking: ""
      context: "short"
    mechanical:
      model: "openrouter/deepseek/deepseek-v4-flash:xhigh"
      effort: "xhigh"
      thinking: ""
      context: "short"
    research:
      model: "openrouter/openai/gpt-5.5:xhigh"
      effort: "xhigh"
      thinking: ""
      context: "short"
    implement:
      model: "openrouter/openai/gpt-5.5:xhigh"
      effort: "xhigh"
      thinking: ""
      context: "short"
    orchestrate:
      model: "openrouter/openai/gpt-5.5:xhigh"
      effort: "xhigh"
      thinking: ""
      context: "short"
    review:
      model: "openrouter/openai/gpt-5.5:xhigh"
      effort: "xhigh"
      thinking: ""
      context: "short"
    refute:
      model: "openrouter/anthropic/claude-sonnet-4.6:xhigh"
      effort: "xhigh"
      thinking: ""
      context: "short"
      verifier_status: "cross_family"
    # memory: gemini-3.7-flash replaces deepseek-v4-flash after live scribe probes 2026-08-29 —
    # deepseek stored a known duplicate; gemini returned `duplicate of <id>` on the same fixture.
    # The model exposes `high` as its top thinking level (no xhigh).
    memory:
      model: "openrouter/google/gemini-3.7-flash:high"
      effort: "high"
      thinking: ""
      context: "short"
  omp:
    # OMP is the one harness with native role indirection, so the category rows are spelled as
    # `@role` tokens and readonly_config.yml.tmpl's `modelRoles` resolves them per profile.
    # Installed omp/18.0.3 exposes default/smol/vision/slow/plan/task/advisor via
    # `omp config get modelRoles`; use those role names as local inspiration, not as the
    # portable taxonomy.
    # User call 2026-08-24: every OMP profile resolves default/vision/slow/plan/task to
    # openrouter/openai/gpt-5.5:xhigh, smol to openrouter/deepseek/deepseek-v4-flash:xhigh, and
    # advisor to openrouter/anthropic/claude-sonnet-4.6:xhigh.
    # Review/refute stay on @advisor (same-family), so refute reports reduced_independence.
    # Verified 17.2.4: a profile carrying `model: "@smol"` runs on modelRoles.smol, and an
    # unknown token fails loudly with `Error: No model selected.` rather than falling back.
    # Same single-dial constraint as Pi: omp maps thinkingLevel straight onto reasoning, and
    # provider/model are separated by `/`, never `:` — `cursor:` parses as a bogus provider.
    lookup:
      model: "@smol"
      effort: "xhigh"
      thinking: ""
      context: "short"
    mechanical:
      model: "@task"
      effort: "xhigh"
      thinking: ""
      context: "short"
    research:
      model: "@task"
      effort: "xhigh"
      thinking: ""
      context: "short"
    implement:
      model: "@task"
      effort: "xhigh"
      thinking: ""
      context: "short"
    orchestrate:
      model: "@plan"
      effort: "xhigh"
      thinking: ""
      context: "short"
    review:
      model: "@advisor"
      effort: "xhigh"
      thinking: ""
      context: "short"
    refute:
      model: "@advisor"
      effort: "xhigh"
      thinking: ""
      context: "short"
      verifier_status: "reduced_independence"
    # memory: direct OpenRouter id, not @smol — modelRoles.smol resolves to deepseek-v4-flash,
    # which hung as omp scribe (killed at 9 min, 2026-08-28) and stored a duplicate on pi;
    # gemini-3.7-flash passed the same scribe fixture. The `:high` suffix is load-bearing:
    # agent-model.partial renders only `model` into the agent frontmatter (effort below is
    # informational), and omp's spawn precedence honors an explicit `:level` suffix
    # (task/executor.ts: effort > `:level` suffix > agent default > pattern-derived).
    # The model exposes `high` as its top thinking level (no xhigh).
    memory:
      model: "openrouter/google/gemini-3.7-flash:high"
      effort: "high"
      thinking: ""
      context: "short"
