# Review-lane model registry: the single source for /agent-review model selection (C2: declare once, generate per tool).
# Profile frontmatter is TEMPLATED from this block; edit here and `chezmoi apply` — never hand-edit model ids in profiles.
# lanes = generation angle lanes + auditors + controller. verifier = cross-family adversarial verifier
# (must be a different model family than lanes; pairing is reviewed by a human here, not inferred at runtime).
# Empty value = the profile omits the field (harness config default). inherit = harness-native parent inheritance.
agent_review_models:
  cursor:
    lanes: "gpt-5.5-medium" # deliberate pin: Cursor omitted-model resolves through auto; keep model explicit to avoid native default takeover
    verifier: "claude-opus-4-8-high"
  copilot:
    lanes: "gpt-5.5"
    verifier: "claude-opus-4.8"
  claude:
    lanes: "inherit" # Claude sessions are launched on a deliberate model; single-family => verifier degraded
    verifier: "inherit"
  codex:
    lanes: "gpt-5.5" # closed 2026-07-27: previously "" (unaudited config-default); kept in sync BY HAND with model_tier_map.codex.orchestration.model — not templated/derived, update both on change
    verifier: "gpt-5.5" # single-family harness; families=same (degraded) is expected, not a defect
  gemini:
    lanes: "gemini-3.1-pro-preview" # closed 2026-07-27: previously "" (unaudited config-default); kept in sync BY HAND with model_tier_map.gemini.orchestration.model — not templated/derived, update both on change
    verifier: "gemini-3.1-pro-preview" # single-family harness; families=same (degraded) is expected, not a defect
  pi:
    lanes: "openrouter/anthropic/claude-opus-4.8:high"
    verifier: "openrouter/openai/gpt-5.5:medium" # cross-family vs the anthropic lanes

# Per-harness, per-work-type model tiering policy (declare once, generate per tool — same
# pattern as agent_review_models above). Full policy/rationale/native-takeover-risk writeup:
# docs/topics/ai-assistants/model-tiering.md — this section is the machine-readable data only.
#
# `band` is an editorial cheap/standard/max judgment per bucket, reviewed by a human here —
# NOT mechanically derived from a model's thinkingBudgets ladder or cost fields; most models
# in litellm_models share an identical minimal/low/medium/high shape, so there is no per-model
# ladder to normalize against. `band` exists so "high" on a gruntwork-tier model (e.g. Haiku
# 4.5) and "high" on a review-tier model (e.g. Opus 4.8) are not read as equivalent effort just
# because the literal label string matches — the bucket assignment is the source of truth, not
# the label. `effort` is the literal value to pass on that harness (a model-ID suffix for
# Cursor, a --effort flag value for Claude Code/Copilot, a -c model_reasoning_effort= value for
# Codex, or a :thinking suffix for Pi); `thinking` is on/off/"" (harness has no separate
# thinking toggle); `context` is short/long, matching the model's own
# contextWindow tier, not an absolute token count.
model_tier_map:
