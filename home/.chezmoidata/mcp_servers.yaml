# Canonical MCP server registry.
# Single source of truth for every generated harness MCP config.
#
# Each entry:
#   name           – server key in the mcpServers object
#   command, args  – stdio server executable and argument list
#   type, url      – `http` for a hosted server and its endpoint
#   oauth_by_tool  – per-harness OAuth blocks; harnesses not listed omit the server
#   exclude_tools  – harnesses that omit this server

mcp_servers:
