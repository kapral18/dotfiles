# OMP model overrides layered over the built-in catalog (user calls 2026-08-07, re-verified
# 2026-08-08). OpenRouter's typed transport in OMP 17.2.9 does not put `modelOverrides…compat.
# extraBody.provider` on the wire — a model lookup confirmed the merged cache entry carries no
# extraBody — so per-request routing filters never reach OpenRouter and providers of ANY
# quantization were eligible. The provider policy therefore rides the OpenRouter preset slug, the
# same mechanism the Claude/Codex/Copilot/Cursor wrappers and OpenCode use:
#   - `deepseek-lanes-max` allows only FP8-or-higher quantization (`fp8, fp16, bf16, fp32`)
#     under a 24 t/s preferred-minimum-throughput floor, with `sort` omitted so default
#     load balancing keeps uptime then price-weights remaining endpoints;
#   - `glm-lanes-max` applies the same FP8-or-higher, 24 t/s floor, no-sort policy to
#     z-ai/glm-5.2;
#   - `kimi-lanes` restricts kimi to Fireworks, Together, and BaseTen under a
#     $16/M completion cap (`only` blocks other providers; no sort).
# `auth` is "none" so no key is stored here; the openrouter transport still authorizes with the
# OPENROUTER_API_KEY env at request time (verified live).
providers:
  openrouter:
    auth: "none"
    baseUrl: "https://openrouter.ai/api/v1"
    models:
      - id: "openai/gpt-5.5"
        name: "GPT-5.5"
        api: "openai-responses"
        provider: "openrouter"
        baseUrl: "https://openrouter.ai/api/v1"
        contextWindow: 1048576
        maxTokens: 128000
      - id: "deepseek/deepseek-v4-flash"
        name: "DeepSeek V4 Flash"
        api: "openai-responses"
        provider: "openrouter"
        baseUrl: "https://openrouter.ai/api/v1"
        contextWindow: 1048576
        maxTokens: 384000
      - id: "anthropic/claude-sonnet-4.6"
        name: "Claude Sonnet 4.6"
        api: "openai-responses"
        provider: "openrouter"
        baseUrl: "https://openrouter.ai/api/v1"
        contextWindow: 1048576
        maxTokens: 128000
      - id: "deepseek/deepseek-v4-flash-0731@preset/deepseek-lanes-max"
        name: "DeepSeek V4 Flash 0731 (deepseek lanes max)"
        api: "openai-responses"
        provider: "openrouter"
        baseUrl: "https://openrouter.ai/api/v1"
        contextWindow: 1048576
        maxTokens: 384000
      - id: "z-ai/glm-5.2@preset/glm-lanes-max"
        name: "GLM 5.2 (glm lanes max)"
        api: "openai-responses"
        provider: "openrouter"
        baseUrl: "https://openrouter.ai/api/v1"
        contextWindow: 1048576
        maxTokens: 128000
      - id: "moonshotai/kimi-k3@preset/kimi-lanes"
        name: "Kimi K3 (kimi lanes)"
        api: "openai-responses"
        provider: "openrouter"
        baseUrl: "https://openrouter.ai/api/v1"
        contextWindow: 1048576
        maxTokens: 131072
