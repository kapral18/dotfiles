#:schema https://developers.openai.com/codex/config-schema.json

approval_policy = "never"
sandbox_mode = "danger-full-access"
web_search = "cached"
check_for_update_on_startup = true
personality = "pragmatic"
model = "gpt-6.1-sol"
model_reasoning_effort = "high"
service_tier = "default"

# __MCP_SERVERS__

[tui]
auto_recap = false
status_line = ["model-with-reasoning", "current-dir", "context-remaining"]

[features]
multi_agent = true
prevent_idle_sleep = true
# ai-kb is the sole durable semantic store (see docs/topics/ai-assistants/memory-and-handoffs.md);
# pin codex's experimental auto-memory off so a default flip can't create a second one.
memories = false

