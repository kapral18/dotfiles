#:schema https://developers.openai.com/codex/config-schema.json

approval_policy = "never"
sandbox_mode = "danger-full-access"
web_search = "cached"
check_for_update_on_startup = true
personality = "pragmatic"
model = "gpt-6-astra"
model_reasoning_effort = "high"
service_tier = "default"

# __MCP_SERVERS__

[tui]
auto_recap = false
status_line = ["model-with-reasoning", "current-dir", "context-remaining"]

[features]
multi_agent = true
prevent_idle_sleep = true
# ai-kb is the sole durable semantic store (see docs/topics/ai-assistants/memory-and-handoffs.md);
# pin codex's experimental auto-memory off so a default flip can't create a second one.
memories = false


# intent-guard: the shared `,task` core keeps the session on the user's goal (~/AGENTS.md §3 step 0).
# Codex runs a config hook only after it is trusted once in `/hooks`.
[[hooks.UserPromptSubmit]]
[[hooks.UserPromptSubmit.hooks]]
type = "command"
command = '"$HOME/bin/,task" hook codex'
timeout = 15

[[hooks.SessionStart]]
matcher = "^compact$"
[[hooks.SessionStart.hooks]]
type = "command"
command = '"$HOME/bin/,task" hook codex'
timeout = 15

[[hooks.PreToolUse]]
matcher = "apply_patch|Write|Edit|Bash"
[[hooks.PreToolUse.hooks]]
type = "command"
command = '"$HOME/bin/,task" hook codex'
timeout = 15

[[hooks.PostToolUse]]
[[hooks.PostToolUse.hooks]]
type = "command"
command = '"$HOME/bin/,task" hook codex'
timeout = 15

[[hooks.Stop]]
[[hooks.Stop.hooks]]
type = "command"
command = '"$HOME/bin/,task" hook codex'
timeout = 15
