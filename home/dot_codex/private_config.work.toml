#:schema https://developers.openai.com/codex/config-schema.json

approval_policy = "on-request"
approvals_reviewer = "auto_review"
sandbox_mode = "workspace-write"
web_search = "cached"
check_for_update_on_startup = true
personality = "pragmatic"
model = "gpt-5.5"
model_reasoning_effort = "xhigh"
service_tier = "default"

# __MCP_SERVERS__

[features]
multi_agent = true
js_repl = true
prevent_idle_sleep = true
# ai-kb is the sole durable semantic store (see docs/topics/ai-assistants/knowledge-base.md);
# pin codex's experimental auto-memory off so a default flip can't create a second one.
memories = false

# Role registry. Without an entry here the files under ~/.codex/agents/ are never read;
# `spawn_agent` only sees roles named in this table. Descriptions and models live in the
# role file itself, so each entry is just the pointer.
[agents.adversarial-verifier]
config_file = "~/.codex/agents/adversarial-verifier.toml"

[agents.criteria-verifier]
config_file = "~/.codex/agents/criteria-verifier.toml"

[agents.findings-auditor]
config_file = "~/.codex/agents/findings-auditor.toml"

[agents.live-ui-review]
config_file = "~/.codex/agents/live-ui-review.toml"

[agents.pr-necessity-auditor]
config_file = "~/.codex/agents/pr-necessity-auditor.toml"

[agents.review-worker]
config_file = "~/.codex/agents/review-worker.toml"

[agents.smol]
config_file = "~/.codex/agents/smol.toml"
