id = "k18.pickers"
name = "Pickers"
version = "0.1.0"
min_herdr_version = "0.9.5"
description = "Keep the session picker cache, frecency, and sidebar badges current"
platforms = ["linux", "macos"]

[[startup]]
command = ["bash", "-c", "\"$HOME/.config/herdr/scripts/pickers/session/registry_hook.sh\"; exec python3 \"$HOME/.config/herdr/scripts/pickers/session/badges.py\""]

[[events]]
on = "workspace.focused"
command = ["bash", "-c", "\"$HOME/.config/herdr/scripts/pickers/session/on_session_switch.sh\"; exec python3 \"$HOME/.config/herdr/scripts/pickers/session/badges.py\""]

[[events]]
on = "workspace.created"
command = ["bash", "-c", "exec \"$HOME/.config/herdr/scripts/pickers/session/index_update_hook.sh\""]

[[events]]
on = "workspace.renamed"
command = ["bash", "-c", "\"$HOME/.config/herdr/scripts/pickers/session/registry_hook.sh\" relabel; exec \"$HOME/.config/herdr/scripts/pickers/session/index_update_hook.sh\""]

[[events]]
on = "workspace.closed"
command = ["bash", "-c", "exec \"$HOME/.config/herdr/scripts/pickers/session/registry_hook.sh\""]
