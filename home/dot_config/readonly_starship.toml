#:schema https://starship.rs/config-schema.json

"$schema" = 'https://starship.rs/config-schema.json'

command_timeout = 500

format = """\
$username$hostname$localip$shlvl$singularity$kubernetes$nats$directory$vcsh\
$fossil_branch$fossil_metrics$git_branch$git_commit$git_state$git_status$hg_branch$hg_state$pijul_channel\
$docker_context$package\
$bun$c$cmake$cobol$cpp$daml$dart$deno$dotnet$elixir$elm$erlang$fennel$fortran$gleam\
$golang$gradle$haskell$haxe$helm$java$julia$kotlin$lua$maven$mojo$nim$nodejs$ocaml$odin\
$opa$perl$php$pulumi$purescript$python$quarto$raku$rlang$red$ruby$rust$scala$solidity\
$swift$terraform$typst$vlang$vagrant$xmake$zig\
$buf$guix_shell$nix_shell$conda$pixi$meson$spack$memory_usage\
$aws$openstack$azure$direnv$env_var$mise$crystal$custom$sudo\
$cmd_duration$line_break$jobs$battery$time$status$container$netns$os$shell$character\
"""

[status]
map_symbol = true
disabled = false
format = '[\[$status\]]($style) '

[shlvl]
disabled = false
format = '[$symbol]($style) '
repeat = true
repeat_offset = 1
symbol = "󰆍 "

[directory]
read_only = " 󰌾"
truncation_symbol = '…/'
truncate_to_repo = false

[git_commit]
commit_hash_length = 8
style = "bold white"

[git_state]
format = '[\($state( $progress_current of $progress_total)\)]($style) '

[git_status]
conflicted = ' ${count}⚠'
ahead = '[⇡${count}](fg:green)'
behind = '[⇣${count}](fg:red)'
diverged = '[⇕⇡${ahead_count}⇣${behind_count}](fg:purple)'
modified = "  ${count}"
renamed = " 󰪹 ${count}"
deleted = " 󰗨 ${count}"
staged = " 󰋴 ${count}"
stashed = "  ${count}"
untracked = "  ${count}"
format = """\
($ahead_behind\
[$stashed](fg:white)\
[$conflicted](fg:red)\
[$deleted](fg:red)\
[$modified](fg:green)\
[$untracked](fg:cyan)\
[$staged](fg:#F5B700)\
[$renamed](fg:#F5B700) )\
"""

[shell]
fish_indicator = ' 🐟 '
bash_indicator = '  '
zsh_indicator = ' 𖼶 '
powershell_indicator = '_'
unknown_indicator = 'mystery shell'
style = 'cyan bold'
disabled = false

[character]
error_symbol = "[✖](bold red) "

[python]
symbol = " "
format = '[${symbol}${pyenv_prefix}(${version} )(\($virtualenv\) )]($style)'
style = "bold green"

[rust]
symbol = " "
format = "[$symbol$version]($style) "
style = "bold green"

[username]
style_user = "bold dimmed blue"
show_always = false

[nodejs]
symbol = " "
style = 'bold green'
version_format = 'v${major}.${minor}'
format = '[$symbol\[$version\]]($style) '
detect_extensions = ['js', 'ts', 'jsx', 'tsx', 'mjs', 'cjs', 'mts', 'cts']

[gcloud]
disabled = true

[aws]
symbol = "  "

[buf]
symbol = " "

[c]
symbol = " "

[conda]
symbol = " "

[dart]
symbol = " "

[docker_context]
symbol = " "

[elixir]
symbol = " "

[elm]
symbol = " "

[fossil_branch]
symbol = " "

[golang]
symbol = " "

[guix_shell]
symbol = " "

[haskell]
symbol = " "

[haxe]
symbol = " "

[hg_branch]
symbol = " "

[java]
symbol = " "

[lua]
symbol = " "

[meson]
symbol = "󰔷 "

[nim]
symbol = "󰆥 "

[nix_shell]
symbol = " "

[pijul_channel]
symbol = " "

[rlang]
symbol = "󰟔 "

[ruby]
symbol = " "

[scala]
symbol = " "
